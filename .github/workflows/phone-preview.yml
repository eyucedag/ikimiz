name: iPhone preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-preview
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'codex/iphone-preview')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check Expo secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::Add the repository Actions secret EXPO_TOKEN, then re-run this job.'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Start signed-in Expo preview
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: '1'
          CI: '1'
        run: |
          node scripts/phone-preview.cjs > "$RUNNER_TEMP/ikimiz-expo.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ikimiz-expo.pid"
          for attempt in $(seq 1 120); do
            if [ -s dist/phone-preview/preview.json ]; then
              cat dist/phone-preview/preview.json
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/ikimiz-expo.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/ikimiz-expo.log"
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/ikimiz-expo.log"
          exit 1

      - name: Save iPhone connection details
        uses: actions/upload-artifact@v4
        with:
          name: iphone-preview
          path: dist/phone-preview/
          retention-days: 1

      - name: Keep the preview available for 45 minutes
        run: |
          echo 'Expo Go account: eyucedag' >> "$GITHUB_STEP_SUMMARY"
          echo 'Connection details are in the iphone-preview artifact.' >> "$GITHUB_STEP_SUMMARY"
          while kill -0 "$(cat "$RUNNER_TEMP/ikimiz-expo.pid")" 2>/dev/null; do
            sleep 15
          done

      - name: Stop preview
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ikimiz-expo.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/ikimiz-expo.pid")" 2>/dev/null || true
          fi
